<style>*{box-sizing:border-box}body{margin:0;background:#0d1118;color:#eef3fb;font:15px system-ui}main{max-width:920px;margin:auto;padding:20px}a{color:#9ddaff}p{color:#b9c9db}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.panel{background:#151e2c;border:1px solid #304158;border-radius:12px;padding:12px;min-width:0}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:manipulation;border-radius:7px}button{font:inherit;min-height:42px;background:#223044;color:white;border:1px solid #4b6280;border-radius:7px;padding:6px 10px;cursor:pointer;touch-action:manipulation}button[aria-pressed=true]{background:#bcb1ff;color:#131020}button:disabled{opacity:.45}#play,#rec{touch-action:none;user-select:none}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:7px 0}.row label{flex:1}.row span{min-width:60px;text-align:right}#status{min-height:2em}h1{margin-bottom:4px}@media(max-width:690px){.grid{grid-template-columns:1fr}main{padding:12px}}</style>
<main><a href="./">← Симулятор</a> · <a href="editor.html">Редактор HOME</a><h1>Песня · GENE + TRACKS</h1><p>Интерактивный макет FM‑1 · 240 × 240 · демонстрационные данные, без звука.</p><div class="grid"><div class="panel"><canvas id="lcd" width="240" height="240" aria-label="Экран песни"></canvas><div class="row"><button id="overview" aria-pressed="true">Вся песня</button><button id="detail" aria-pressed="false">Фрагмент</button><button id="back" hidden>← Песня</button></div></div><div class="panel"><div class="row"><button id="play" aria-label="PLAY: удерживай две секунды для STOP">▶ PLAY</button><button id="rec" aria-pressed="false">● REC</button><button id="home" hidden>HOME</button><button id="seq">SEQ</button><button id="mixer" aria-expanded="false" aria-controls="mixer-keys">GLO · MIXER</button></div><small>PLAY: нажать — пуск/пауза, удерживать 2 с — стоп. SELECT: дорожки 1–9, затем части SONG. В обратную сторону — тот же порядок назад.</small><div class="row"><label id="select-label">SELECT · дорожка</label><button data-do="select,-1">−</button><button data-do="select,1">+</button></div><div class="row"><label id="preset-label">PRESETS · звуки</label><button data-do="preset,-1">−</button><button data-do="preset,1">+</button></div><div id="clear-locks" hidden><p id="clear-message" role="alert"></p><button id="cancel-clear">Отмена</button></div><div id="mixer-keys" class="row" hidden></div><div id="knobs"></div><p id="status" role="status"></p></div></div></main>
